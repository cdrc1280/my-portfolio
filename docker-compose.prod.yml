# Production-like stack: `docker compose -f docker-compose.prod.yml up -d --build`
# Expects a real .env (APP_ENV=production, APP_KEY, DB_*, MAIL_*, ...).
x-app: &app
  build:
    context: .
    dockerfile: docker/php/Dockerfile
    target: prod
  image: portfolio-app
  env_file: .env
  volumes:
    - storage:/var/www/html/storage/app
  depends_on:
    - db
    - redis

services:
  app:
    <<: *app
    restart: unless-stopped
    environment:
      RUN_MIGRATIONS: "true"

  queue:
    <<: *app
    restart: unless-stopped
    entrypoint: []
    command: php artisan queue:work redis --tries=3 --backoff=10 --max-time=3600

  scheduler:
    <<: *app
    restart: unless-stopped
    entrypoint: []
    command: php artisan schedule:work

  web:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: web
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - storage:/var/www/html/storage/app:ro
    depends_on:
      - app

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - dbdata:/var/lib/mysql

  redis:
    image: redis:7-alpine
    restart: unless-stopped

volumes:
  dbdata:
  storage:
