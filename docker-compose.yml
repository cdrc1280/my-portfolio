# Local development stack. Production uses the `prod` and `web` targets of
# docker/php/Dockerfile (see docker-compose.prod.yml).
x-app: &app
  build:
    context: .
    dockerfile: docker/php/Dockerfile
    target: dev
    args:
      UID: ${UID:-1000}
      GID: ${GID:-1000}
  image: portfolio-dev
  volumes:
    - .:/var/www/html
  # No env_file: Laravel reads .env from the bind mount, so phpunit.xml's
  # testing overrides (sqlite, array cache, ...) still win inside `make test`.
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  app:
    <<: *app
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx:/etc/nginx/conf.d:ro
    depends_on:
      - app

  queue:
    <<: *app
    restart: unless-stopped
    user: www-data
    command: php artisan queue:work redis --tries=3 --backoff=10 --sleep=1

  scheduler:
    <<: *app
    restart: unless-stopped
    user: www-data
    command: php artisan schedule:work

  node:
    <<: *app
    user: www-data
    # public/hot tells Laravel to load assets from the Vite dev server. A copy
    # left over from the last run would point the page at a server that isn't
    # up yet while `npm install` runs, so every script, style and font fails.
    # Removing it first makes Laravel use public/build until Vite writes a
    # fresh one. The `vp` wrapper doesn't hand the stop signal on to Vite, so
    # the shell traps it and deletes the file itself when the container stops.
    # The PHP-FPM base image stops containers with SIGQUIT; this one wants SIGTERM.
    stop_signal: SIGTERM
    init: true
    command:
      - sh
      - -c
      - |
        rm -f public/hot
        npm install || exit 1
        trap 'rm -f public/hot; kill $$pid 2>/dev/null; exit 0' TERM INT
        npm run dev &
        pid=$$!
        wait $$pid
        rm -f public/hot
    environment:
      VITE_HOST: 0.0.0.0
      VITE_HMR_HOST: localhost
      VITE_PORT: ${VITE_PORT:-5173}
    ports:
      - "${VITE_PORT:-5173}:${VITE_PORT:-5173}"

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-portfolio}
      MYSQL_USER: ${DB_USERNAME:-portfolio}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    ports:
      - "${FORWARD_DB_PORT:-3306}:3306"
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.21
    restart: unless-stopped
    ports:
      - "${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025"

volumes:
  dbdata:
  redisdata:
